<div class="breadcrumb">
  <div class="container">
    <a href="/">홈</a>
    {% if include.items %}
      {% for item in include.items %}
        <span class="sep">/</span>
        {% if item.url %}<a href="{{ item.url }}">{{ item.text }}</a>{% else %}<span class="current">{{ item.text }}</span>{% endif %}
      {% endfor %}
    {% endif %}
  </div>
</div>
