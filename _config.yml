title: 크루즈 인터내셔널
tagline: 크루즈 전문 여행사 · Since 2000
description: "25년간 쌓아 온 크루즈 전문성으로, 싱가포르 단기 항해부터 럭셔리 올인클루시브까지 맞춤 안내합니다."
url: "https://cruise.co.kr"
baseurl: ""

collections:
  cruiselines:
    output: true
  voyages:
    output: true

defaults:
  - scope:
      path: ""
      type: "cruiselines"
    values:
      layout: "cruiseline"
  - scope:
      path: ""
      type: "voyages"
    values:
      layout: "product"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - docs
  - site_data
