title: 크루즈 인터내셔널
tagline: 럭셔리 크루즈 전문 여행사 · Since 2000
description: "24년간 세계 최상위 크루즈 선사와 함께해온 전문성으로, 당신만의 완벽한 항해를 설계합니다."
url: "https://cruise.co.kr"
baseurl: ""

collections:
  cruiselines:
    output: true
  voyages:
    output: true

defaults:
  - scope:
      path: ""
      type: "cruiselines"
    values:
      layout: "cruiseline"
  - scope:
      path: ""
      type: "voyages"
    values:
      layout: "product"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - docs
